    <style>
      :root { --blue:#344da7; --blue-dark:#263d91; --red:#f32635; --ink:#101010; --paper:#fff; }
      * { box-sizing:border-box; }
      html,body { margin:0; padding:0; background:#d9dbe2; color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
      @page { size:A4 portrait; margin:0; }
      .sheet { position:relative; width:210mm; height:297mm; margin:8mm auto; overflow:hidden; background:#fff; break-after:page; page-break-after:always; }
      .sheet:last-child { break-after:auto; page-break-after:auto; }

      .cover { background:#fff; }
      .cover-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:58% center; }
      .cover-white { position:absolute; inset:0; background:#fff; clip-path:polygon(0 0,100% 0,45% 47%,0 68%); }
      .cover-blue-stripe { position:absolute; z-index:2; width:255mm; height:18mm; right:-95mm; top:47mm; background:var(--blue); transform:rotate(-43deg); transform-origin:center; }
      .cover-red { position:absolute; z-index:3; left:-52mm; bottom:-33mm; width:185mm; height:180mm; background:var(--red); transform:rotate(45deg); }
      .cover-blue-bottom { position:absolute; z-index:2; right:-1mm; bottom:0; width:102mm; height:82mm; background:var(--blue); clip-path:polygon(38% 0,100% 0,100% 100%,0 100%); }
      .logo-crop { position:absolute; z-index:4; left:17mm; top:16mm; width:104mm; height:61mm; overflow:hidden; }
      .logo-crop img { position:absolute; width:104mm; height:104mm; left:0; top:-24mm; object-fit:contain; }
      .cover-year { position:absolute; z-index:5; left:13mm; bottom:52mm; color:#fff; font-size:31pt; font-weight:900; line-height:.82; text-shadow:0 1.2mm 1.5mm rgba(0,0,0,.28); }
      .cover-year span { display:block; font-size:67pt; letter-spacing:-3pt; }
      .cover-line { position:absolute; z-index:5; right:12mm; bottom:14mm; width:87mm; color:#fff; font-size:17pt; font-weight:900; line-height:.91; text-align:left; text-transform:uppercase; text-shadow:0 .8mm 1mm rgba(0,0,0,.25); }
      .cover-line strong { display:block; font-size:35pt; line-height:.72; }

      .inside { background:var(--blue); }
      .inside .panel { position:absolute; top:8mm; bottom:4mm; background:#fff; }
      .inside.left-rail .panel { left:17mm; right:0; border-radius:7mm 0 0 0; }
      .inside.right-rail .panel { left:0; right:17mm; border-radius:0 7mm 0 0; }
      .rail-title { position:absolute; z-index:2; top:82mm; color:#fff; font-size:11pt; font-weight:700; letter-spacing:.5pt; white-space:nowrap; writing-mode:vertical-rl; text-transform:uppercase; }
      .left-rail .rail-title { left:6.4mm; transform:rotate(180deg); }
      .right-rail .rail-title { right:6.4mm; }
      .page-tab { position:absolute; z-index:3; bottom:0; width:20mm; height:33mm; display:grid; place-items:end center; padding-bottom:5mm; background:#fff; color:#050505; font-size:24pt; font-weight:800; clip-path:polygon(0 0,70% 18%,100% 18%,100% 100%,0 100%); }
      .left-rail .page-tab { left:0; }
      .right-rail .page-tab { right:0; transform:scaleX(-1); }
      .right-rail .page-tab span { transform:scaleX(-1); }
      .catalog-grid { position:absolute; inset:7mm 8mm 6mm; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(8,1fr); column-gap:8mm; row-gap:1.5mm; }
      .item { position:relative; min-height:0; display:grid; grid-template-columns:31mm 1fr; gap:3mm; overflow:hidden; }
      .code-tag { position:absolute; z-index:2; left:0; top:0; height:7mm; min-width:35mm; display:flex; align-items:center; color:#fff; background:var(--red); clip-path:polygon(0 0,100% 0,91% 100%,0 100%); font-size:8pt; font-weight:900; letter-spacing:.2pt; }
      .code-tag .brand { width:12mm; height:6mm; margin-right:1mm; display:grid; place-items:center; color:var(--blue-dark); background:#fff; border:.35mm solid var(--red); font-size:5pt; font-weight:900; }
      .item-photo { width:31mm; height:24mm; align-self:end; object-fit:contain; mix-blend-mode:multiply; }
      .item-copy { align-self:center; min-width:0; padding-top:1mm; text-align:center; }
      .item-copy h3 { margin:0 0 1mm; font-size:8.1pt; font-weight:900; line-height:.91; }
      .details { margin:0; font-size:5.7pt; line-height:1.08; }
      .application { margin:1.4mm 0 0; font-size:7.7pt; line-height:1.02; }
      .compact .application { font-size:6.5pt; }
      .compact .details { font-size:5.2pt; }

      .shock .panel { padding-top:24mm; }
      .shock-title { position:absolute; z-index:3; top:14mm; left:35mm; right:20mm; height:17mm; display:grid; place-items:center; background:var(--red); color:#fff; font-size:24pt; font-weight:900; text-transform:uppercase; }
      .shock .catalog-grid { top:36mm; grid-template-rows:repeat(6,1fr); row-gap:3mm; }
      .shock .item { grid-template-columns:34mm 1fr; }
      .shock .item-photo { height:30mm; }
      .shock .item-copy h3 { font-size:8.7pt; }
      .shock .details { font-size:7pt; }
      .shock .application { font-size:9pt; }

      .back { background:#fff; }
      .back::before { content:""; position:absolute; top:0; left:0; right:0; height:13mm; background:var(--blue); }
      .back::after { content:""; position:absolute; bottom:0; left:0; right:0; height:13mm; background:var(--red); }
      .back-logo { position:absolute; left:50%; top:92mm; width:108mm; height:76mm; overflow:hidden; transform:translateX(-50%); }
      .back-logo img { position:absolute; width:108mm; height:108mm; top:-23mm; object-fit:contain; }
      .contacts { position:absolute; left:31mm; right:31mm; top:188mm; display:grid; grid-template-columns:1fr 1fr; gap:20mm; text-align:center; }
      .contact-icon { width:32mm; height:32mm; margin:0 auto 5mm; display:grid; place-items:center; border:1.8mm solid #090309; border-radius:50%; color:#090309; font-size:25pt; font-weight:800; }
      .contact strong { font-size:11pt; line-height:1.15; }
      .contact small { display:block; font-size:9pt; font-weight:800; }

      @media print { html,body { background:#fff; print-color-adjust:exact; -webkit-print-color-adjust:exact; } .sheet { margin:0; } }
          .item-photo.missing { display:grid; place-items:center; color:#60709e; background:#eef1f8; font-size:7pt; font-weight:700; }
          .hero-cover { background:linear-gradient(180deg,#0b1534,#152a65); color:#fff; font-family:Arial,Helvetica,sans-serif; }
      .hero-grid { position:absolute; inset:0; opacity:.09; background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px); background-size:16mm 16mm; }

      .hero-rings { position:absolute; right:-35mm; top:69mm; width:165mm; height:165mm; border:1px solid #ffffff80; border-radius:50%; box-shadow:inset 0 0 0 20mm #ffffff15,0 0 0 26mm #ffffff10; }
      .hero-rings:after { content:''; position:absolute; inset:33mm; border:2mm solid #e32635; border-radius:50%; }
      .hero-logo { position:absolute; left:15mm; top:14mm; width:85mm; height:45mm; object-fit:contain; object-position:left center; }
      .hero-content { position:absolute; left:15mm; right:10mm; top:73mm; }
      .hero-content p { margin:0 0 18mm; color:#d3def4; font-size:11pt; font-weight:800; letter-spacing:.08em; }
      .hero-content h1 { position:relative; margin:0; font:50pt/.98 Impact,sans-serif; letter-spacing:.01em; }
      .hero-rule { width:45mm; height:2.5mm; margin:10mm 0; background:#e32635; }
      .hero-content strong,.hero-content span { display:block; font-size:12pt; line-height:1.7; }
      .hero-content span { color:#d3def4; font-size:11pt; }
      .hero-bottom { position:absolute; left:15mm; right:15mm; bottom:18mm; border-top:.3mm solid #ffffff80; padding-top:10mm; }
      .hero-bottom strong,.hero-bottom span { display:block; }
      .hero-bottom strong { font:26pt Impact,sans-serif; }
      .hero-bottom span { margin-top:3mm; color:#d3def4; font-size:9pt; font-weight:800; }
      .hero-final { position:absolute; z-index:3; left:31mm; right:16mm; top:76mm; bottom:33mm; padding:15mm 11mm; border-top:3mm solid #e32635; background:#0b1534; color:white; }
      .hero-final img { display:block; width:90mm; height:52mm; object-fit:contain; object-position:left center; }
      .hero-final h2 { margin:10mm 0 0; font:29pt/.96 Impact,sans-serif; }
      .hero-final .hero-rule { width:33mm; margin:6mm 0; height:1.5mm; }
      .hero-final p { color:#d3def4; font-size:10pt; }
      .hero-final strong,.hero-final span { display:block; margin-top:5mm; font-size:11pt; }

        ["8023 PU","JOST","Coxim da 5ª roda (2 polegadas)","","Jost","","8023 PU.jpg"],
        ["8001 PU","ROD.","Borracha rodoviária sem aba","Altura: 50 mm | Diâmetro: 62 mm | Interno do furo: 36 mm","","","8001 PU.jpg"],
        ["8002 PU","ROD.","Borracha rodoviária com aba","Altura: 50 mm | Diâmetro: 62 mm | Interno do furo: 36 mm","","","8002 PU.jpg"]
      ].map(([code,brand,name,details,application,sizeClass='',image='']) => ({code,brand,name,details,application,sizeClass,image}));

      const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[char]);
      const imagePath = product => product.image ? `../assets/img/Peças de PU/${encodeURIComponent(product.image)}` : '';
      const item = product => `<article class="item ${product.sizeClass}"><div class="code-tag"><span class="brand">${esc(product.brand)}</span>${esc(product.code)}</div>${product.image ? `<img class="item-photo" src="${imagePath(product)}" alt="${esc(product.name)}">` : `<div class="item-photo missing">Foto em breve</div>`}<div class="item-copy"><h3>${esc(product.name)}</h3>${product.details ? `<p class="details">${esc(product.details)}</p>` : ''}<p class="application">${esc(product.application)}</p></div></article>`;
      const insidePage = (products, side, number, shock=false) => `<section class="sheet inside ${side}-rail ${shock?'shock':''}"><div class="panel">${shock?'<div class="shock-title">Buchas do amortecedor</div>':''}<div class="catalog-grid">${products.map(item).join('')}</div></div><div class="rail-title">Borrachas Rocha | Catálogo 2026</div><div class="page-tab"><span>${number}</span></div></section>`;
      const logo = '../assets/img/Logos/Logo.webp';
      const cover = `<section class="sheet hero-cover">
        <div class="hero-grid"></div><div class="hero-r">R</div><div class="hero-rings"></div>
        <img class="hero-logo" src="../assets/img/Logos/Logo-Branca.webp" alt="Borrachas Rocha">
        <div class="hero-content"><p>CATÁLOGO DE PEÇAS EM POLIURETANO</p><h1>A PEÇA CERTA.<br>O CAMINHO CERTO.</h1><div class="hero-rule"></div><strong>REFERÊNCIAS, MEDIDAS E APLICAÇÕES</strong><span>para caminhões, veículos leves e implementos.</span></div>
        <div class="hero-bottom"><strong>LINHA PU</strong><span>EDIÇÃO 2026 / 78 REFERÊNCIAS</span></div>
      </section>`;
      const back = `<section class="sheet back"><div class="back-logo"><img src="${logo}" alt="Borrachas Rocha"></div><div class="contacts"><div class="contact"><div class="contact-icon">✉</div><strong>borrachasrocha@hotmail.com</strong></div><div class="contact"><div class="contact-icon">☎</div><strong>(31) 97358-9165</strong><small>WhatsApp</small></div></div></section>`;
      const first = insidePage(items.slice(0,16),'left',1);
      const second = insidePage(items.slice(16,32),'right',2);
      const shock = insidePage(items.slice(32,44),'left',3,true);
      const additions1 = insidePage(items.slice(44,60),'left',4);
      const additions2 = insidePage(items.slice(60,76),'right',5);
      const finalPanel = `<div class="hero-final"><img src="../assets/img/Logos/Logo-Branca.webp" alt="Borrachas Rocha"><h2>A PEÇA CERTA PARA<br>O SEU CAMINHO.</h2><div class="hero-rule"></div><p>Consulte disponibilidade, medidas e aplicação.</p><strong>WHATSAPP (31) 97358-9165</strong><span>borrachasrocha@hotmail.com</span><span>borrachasrocha.com.br</span></div>`;
      const additions3 = insidePage(items.slice(76),'left',6).replace('</section>',finalPanel+'</section>');
      document.querySelector('#catalog').innerHTML = cover + first + second + shock + additions1 + additions2 + additions3;
      const preview = new URLSearchParams(location.search).get('preview');
      if (preview !== null) document.querySelectorAll('.sheet').forEach((page,index) => page.style.display = index === Number(preview) ? 'block' : 'none');
    </script>
  </body>
</html>
